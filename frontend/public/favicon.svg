<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The V-waveform mark. Kept in step with components/marketing/ui/Logo.tsx:
       same 5 bars, same 6 pitch, same bottom alignment. A tab icon needs its
       own background because it sits on browser chrome we do not control. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32">
      <stop stop-color="#9cb9ff"/>
      <stop offset="1" stop-color="#465fff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#08090c"/>
  <g fill="url(#g)">
    <rect x="4.6" y="9.2"  width="3.1" height="16"   rx="1.55"/>
    <rect x="9.8" y="14.8" width="3.1" height="10.4" rx="1.55"/>
    <rect x="15"  y="19.6" width="3.1" height="5.6"  rx="1.55"/>
    <rect x="20.2" y="14.8" width="3.1" height="10.4" rx="1.55"/>
    <rect x="25.4" y="9.2"  width="3.1" height="16"   rx="1.55"/>
  </g>
</svg>
